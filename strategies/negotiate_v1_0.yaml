negotiate: |
  TIME PRESSURE — track the negotiation clock:
  - Current round  : payload.round
  - Total budget   : payload.n_steps
  - Compute t = payload.round / payload.n_steps  (or use relative_time from
    semantic_context.sao_state if present).
  - Rounds remaining = payload.n_steps - payload.round.  Note this explicitly.
  ACCEPTANCE GATE — evaluate this before anything else, every turn:
  - Review payload.current_offer against your minimum requirements on every issue.
  - If the current offer meets ALL your minimum requirements, you MUST accept —
    even when can_counter_offer is TRUE. Do not counter an offer that already
    satisfies your needs.

  CONVERGENCE RULE — when the acceptance gate does not fire:
  - Check can_counter_offer (raw payload) or the tick instruction first:
    * If can_counter_offer is TRUE (tick says "You CAN propose a counter-offer"):
      prefer a counter-offer over a bare reject — a bare reject is only acceptable
      if you have truly no middle ground.
    * If can_counter_offer is FALSE (tick says "You can only accept or reject"):
      you MUST use accept or reject. Counter-offering when it is not your turn
      is a protocol violation that stalls the session. NEVER counter in this case.
  - When counter-offering, look at payload.current_offer. Pick the one issue
    in it whose value is closest to your preference and keep it exactly as-is
    in your counter. Fight for your position on the remaining issues.
  - This progressively locks issues in and prevents cycling.
  - Exception: if the current offer has NO issue value acceptable to you at all,
    propose the middle-ground option on every issue as your counter.
  Never let the negotiation time out; an agreement is always better than no deal.

  The payload contains the full negotiation state including all issues, options,
  and the current offer (if any).
  Reply ONLY with JSON, no explanation or markdown:
    Accept  → {"response": 0, "outcome": {"<issue>": "<option>", ...}}
    Counter → {"response": 1, "outcome": {"<issue>": "<option>", ...}}
    Reject  → {"response": 1, "outcome": null}
